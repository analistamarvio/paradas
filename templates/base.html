<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paradas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <div class="flex-grow-1 d-flex justify-content-center">
      <a class="navbar-brand d-flex align-items-center gap-3 flex-wrap justify-content-center" href="{{ url_for('dashboard') }}" style="padding: 0.75rem 0;">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" style="height:72px; width:auto;">
        <span class="fw-bold text-uppercase" style="font-size:2rem; line-height:1; text-align:center;">Sistemas de Parada dos Teares</span>
      </a>
    </div>
  </div>
</nav>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="mt-2">
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
