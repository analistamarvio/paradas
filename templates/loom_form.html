{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
<h3>{{ 'Editar tear' if loom else 'Novo tear' }}</h3>
  <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Voltar para dashboard</a>
</div>
<form method="post" action="{{ action_url }}" class="row g-3">
  <div class="col-md-4">
    <label class="form-label">Nome</label>
    <input class="form-control" type="text" value="TEAR" disabled>
    <div class="form-text">Nome fixo.</div>
  </div>
  <div class="col-md-4">
    <label class="form-label">Número</label>
    <input class="form-control" type="text" name="number" value="{{ loom['number'] if loom else '' }}" required>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a class="btn btn-secondary" href="{{ url_for('looms_list') }}">Voltar para tears</a>
  </div>
</form>
{% endblock %}
