{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>{{ 'Editar usuário' if user else 'Novo usuário' }}</h3>
  <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Voltar para dashboard</a>
</div>
<form method="post" action="{{ action_url }}" class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Usuário</label>
    <input class="form-control" type="text" name="username" value="{{ user['username'] if user else '' }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">Senha</label>
    <input class="form-control" type="password" name="password" placeholder="{{ 'Deixe em branco para não mudar' if user else '' }}" {% if not user %}required{% endif %}>
  </div>
  <div class="col-md-6">
    <label class="form-label">Setor</label>
    <select class="form-select" name="sector_id">
      <option value="">-- selecione --</option>
      {% for s in sectors %}
      <option value="{{ s.id }}" {% if user and user['sector_id'] == s.id %}selected{% endif %}>{{ s.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Tipos de turno (seleção múltipla)</label>
    <select class="form-select" name="shift_type_ids" multiple size="6">
      {% for t in shift_types %}
      <option value="{{ t.id }}" {% if t.id in selected_shift_types %}selected{% endif %}>{{ t.name }}</option>
      {% endfor %}
    </select>
    <div class="form-text">Segure Ctrl (ou Shift) para marcar mais de um.</div>
  </div>
  <div class="col-12">
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a class="btn btn-secondary" href="{{ url_for('users_list') }}">Voltar para usuários</a>
  </div>
</form>
{% endblock %}
