{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4 p-3 rounded" style="background:#0a3d62; color:#fff;">
  <h2 class="mb-0 fw-bold text-uppercase">USUÁRIOS</h2>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-light btn-lg fw-bold text-uppercase" href="{{ url_for('dashboard') }}">Voltar</a>
    <a class="btn btn-light btn-lg fw-bold text-uppercase" style="color:#0a3d62;" href="{{ url_for('users_create') }}">Adicionar</a>
  </div>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Usuário</th>
      <th>Setor</th>
      <th>Tipos de turno</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.username }}</td>
      <td>{{ u.sector_name or '-' }}</td>
      <td>{{ u.shift_types or '-' }}</td>
      <td class="text-end">
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('users_edit', user_id=u.id) }}">Editar</a>
        <form method="post" action="{{ url_for('users_delete', user_id=u.id) }}" class="d-inline" onsubmit="return confirm('Remover usuário?');">
          <button class="btn btn-sm btn-outline-danger">Excluir</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
